<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <title>Gabriel's Budget Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; background: #f5f7fa; margin: 0; }
    .box { max-width: 370px; margin: 30px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 18px; }
    h2 { text-align: center; margin: 0 0 18px 0; font-size: 1.3em; }
    .btn { display: block; width: 100%; margin: 8px 0; padding: 11px; border: none; border-radius: 5px; background: #3498db; color: #fff; font-size: 1em; cursor: pointer; box-sizing: border-box; }
    .btn:hover { background: #2980b9; }
    .btn.back { background: #aaa; }
    .btn.back:hover { background: #888; }
    .prompt-label { text-align: center; margin: 4px 0 14px; color: #555; font-size: 0.95em; font-weight: bold; }
    .input-row { margin: 15px 0; }
    input[type=number] { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 1em; box-sizing: border-box; }
    .results-body { background: #f8f9fa; border-radius: 5px; padding: 13px; font-size: 0.98em; margin-bottom: 10px; }
    .results-body h4 { margin: 10px 0 6px 0; font-size: 1em; }
    .item { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .sub-item { display: flex; justify-content: space-between; margin-bottom: 4px; padding-left: 14px; font-size: 0.93em; color: #444; }
    .hl { font-weight: bold; color: #e74c3c; }
    .note { font-size: 0.85em; color: #888; font-style: italic; margin-top: 6px; }
  </style>
</head>
<body>
<div class="box">
  <h2>Gabriel's Budget Calculator</h2>

  <div id="s-menu">
    <button class="btn" onclick="pickMode(1)">Gabriel's Income</button>
    <button class="btn" onclick="pickMode(2)">Gabriel's Lump Sum</button>
    <button class="btn" onclick="pickSavingsOnly()">Just Savings</button>
  </div>

  <div id="s-em" style="display: none;">
    <p class="prompt-label">Is the emergency fund full?<br><span style="font-weight:normal;font-size:0.9em;color:#888">(goal ~€6,000)</span></p>
    <button class="btn" onclick="pickEm(true)">Yes — fund is full</button>
    <button class="btn" onclick="pickEm(false)">No — still building</button>
    <button class="btn back" onclick="goTo('s-menu')">Back</button>
  </div>

  <div id="s-input" style="display: none;">
    <div class="input-row">
      <input type="number" id="amt" min="0" step="0.01" placeholder="Enter amount (€)">
    </div>
    <button class="btn" onclick="calc()">Calculate</button>
    <button class="btn back" onclick="backFromInput()">Back</button>
  </div>

  <div id="s-results" style="display: none;">
    <div id="results-body" class="results-body"></div>
    <button class="btn back" onclick="goTo('s-menu')">Back to menu</button>
  </div>

</div>
<script>
  var mode = 0;
  var emFull = false;
  var screens = ['s-menu', 's-em', 's-input', 's-results'];

  function goTo(id) {
    for (var i = 0; i < screens.length; i++) {
      document.getElementById(screens[i]).style.display = (screens[i] === id) ? 'block' : 'none';
    }
  }

  function pickMode(m) {
    mode = m;
    emFull = false;
    document.getElementById('amt').value = '';
    goTo('s-em');
  }

  function pickEm(full) {
    emFull = full;
    document.getElementById('amt').value = '';
    goTo('s-input');
  }

  function pickSavingsOnly() {
    mode = 4;
    document.getElementById('amt').value = '';
    goTo('s-input');
  }

  function backFromInput() {
    document.getElementById('amt').value = '';
    goTo(mode === 4 ? 's-menu' : 's-em');
  }

  function row(label, val, hl) {
    return '<div class="item"><span>' + label + '</span><span' + (hl ? ' class="hl"' : '') + '>' + val + ' \u20ac</span></div>';
  }

  function subRow(label, val) {
    return '<div class="sub-item"><span>' + label + '</span><span>' + val + ' \u20ac</span></div>';
  }

  // BrightPensioen takes 15% of the savings pot first (recommended tier:
  // above the employer-match minimum, below the full retirement-gap target).
  // The remaining 85% keeps the original 20/40/30/10 BTC/VUAA/EUNL/IS3N ratio.
  function savingsAlloc(s) {
    var bright = s * 0.15;
    var degiro = s - bright;
    return '<h4>Savings Allocation</h4>' +
      row('BrightPensioen (15%)', bright.toFixed(2)) +
      row('Degiro (85%)', degiro.toFixed(2)) +
      subRow('BTC (20%)', (degiro * 0.20).toFixed(2)) +
      subRow('VUAA (40%)', (degiro * 0.40).toFixed(2)) +
      subRow('EUNL (30%)', (degiro * 0.30).toFixed(2)) +
      subRow('IS3N (10%)', (degiro * 0.10).toFixed(2));
  }

  function calc() {
    var a = parseFloat(document.getElementById('amt').value);
    if (isNaN(a) || a <= 0) { alert('Enter a valid amount'); return; }
    var r = '';

    if (mode === 1) {
      var s = emFull ? a * 0.20 : a * 0.10;
      var em = emFull ? 0 : a * 0.10;
      r += '<h4>Income Allocation</h4>' +
        row('Needs (50%)', (a * 0.50).toFixed(2), true) +
        row('Wants (30%)', (a * 0.30).toFixed(2), true) +
        row('Savings (' + (emFull ? '20' : '10') + '%)', s.toFixed(2), true);
      if (!emFull) {
        r += row('Emergency Fund (10%)', em.toFixed(2), true) +
          '<div class="note">Stop contributions once ~\u20ac6,000 is reached \u2014 redirect to savings</div>';
      } else {
        r += '<div class="note">Emergency fund full \u2014 extra 10% redirected to savings</div>';
      }
      r += savingsAlloc(s);

    } else if (mode === 2) {
      var t = a * 0.10, rem = a - t;
      var needs = rem * 0.30, wants = rem * 0.20, s2 = rem * 0.50;
      r += '<h4>Lump Sum Allocation</h4>' +
        row('Tithes (10%)', t.toFixed(2)) +
        row('Needs (30%)', needs.toFixed(2), true) +
        row('Wants (20%)', wants.toFixed(2), true) +
        row('Savings (50%)', s2.toFixed(2), true) +
        savingsAlloc(s2) +
        '<h4 style="margin-top:12px">Emergency Fund</h4>' +
        (emFull
          ? '<div class="note">Emergency fund full \u2713</div>'
          : '<div class="note">Still building \u2014 goal ~\u20ac6,000</div>');

    } else if (mode === 4) {
      r += savingsAlloc(a);
    }

    document.getElementById('results-body').innerHTML = r;
    goTo('s-results');
  }
</script>
</body>
</html>
